# XcodeGen specification for the Analog Anchor iOS foundation.
#
# Generate the Xcode project with:
#     brew install xcodegen
#     cd AnalogAnchorWorkspace && xcodegen generate
#
# This produces AnalogAnchor.xcodeproj with the app target, unit-test target and
# a local Swift package dependency on AnalogAnchorKit. The Screen Time
# extensions (Shield Configuration, DeviceActivity Monitor) are added in Phase 3.
name: AnalogAnchor
options:
  bundleIdPrefix: com.analoganchor
  deploymentTarget:
    iOS: "17.0"    # SwiftData (shared store) requires iOS 17.
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  AnalogAnchorKit:
    path: AnalogAnchorKit

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""          # Fill with your Apple Developer Team ID.
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "2.8.7"
    CURRENT_PROJECT_VERSION: "38"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  AnalogAnchor:
    type: application
    platform: iOS
    sources:
      - path: AnalogAnchor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.analoganchor.app
        INFOPLIST_FILE: AnalogAnchor/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: AnalogAnchor/Resources/AnalogAnchor.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_EMIT_LOC_STRINGS: YES
    entitlements:
      path: AnalogAnchor/Resources/AnalogAnchor.entitlements
    # The app embeds the four Screen Time extensions below.
    dependencies:
      - package: AnalogAnchorKit
      - target: AnalogAnchorShieldConfiguration
      - target: AnalogAnchorShieldAction
      - target: AnalogAnchorDeviceActivityMonitor
      - target: AnalogAnchorDeviceActivityReport

  AnalogAnchorShieldConfiguration:
    type: app-extension
    platform: iOS
    sources:
      - path: AnalogAnchorShieldConfiguration
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.analoganchor.app.shieldconfiguration
        INFOPLIST_FILE: AnalogAnchorShieldConfiguration/Info.plist
        CODE_SIGN_ENTITLEMENTS: AnalogAnchorShieldConfiguration/AnalogAnchorShieldConfiguration.entitlements
        GENERATE_INFOPLIST_FILE: NO
    entitlements:
      path: AnalogAnchorShieldConfiguration/AnalogAnchorShieldConfiguration.entitlements

  AnalogAnchorShieldAction:
    type: app-extension
    platform: iOS
    sources:
      - path: AnalogAnchorShieldAction
    dependencies:
      - package: AnalogAnchorKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.analoganchor.app.shieldaction
        INFOPLIST_FILE: AnalogAnchorShieldAction/Info.plist
        CODE_SIGN_ENTITLEMENTS: AnalogAnchorShieldAction/AnalogAnchorShieldAction.entitlements
        GENERATE_INFOPLIST_FILE: NO
    entitlements:
      path: AnalogAnchorShieldAction/AnalogAnchorShieldAction.entitlements

  AnalogAnchorDeviceActivityMonitor:
    type: app-extension
    platform: iOS
    sources:
      - path: AnalogAnchorDeviceActivityMonitor
    dependencies:
      - package: AnalogAnchorKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.analoganchor.app.deviceactivitymonitor
        INFOPLIST_FILE: AnalogAnchorDeviceActivityMonitor/Info.plist
        CODE_SIGN_ENTITLEMENTS: AnalogAnchorDeviceActivityMonitor/AnalogAnchorDeviceActivityMonitor.entitlements
        GENERATE_INFOPLIST_FILE: NO
    entitlements:
      path: AnalogAnchorDeviceActivityMonitor/AnalogAnchorDeviceActivityMonitor.entitlements

  AnalogAnchorDeviceActivityReport:
    type: app-extension
    platform: iOS
    sources:
      - path: AnalogAnchorDeviceActivityReport
    dependencies:
      - package: AnalogAnchorKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.analoganchor.app.deviceactivityreport
        INFOPLIST_FILE: AnalogAnchorDeviceActivityReport/Info.plist
        CODE_SIGN_ENTITLEMENTS: AnalogAnchorDeviceActivityReport/AnalogAnchorDeviceActivityReport.entitlements
        GENERATE_INFOPLIST_FILE: NO
    entitlements:
      path: AnalogAnchorDeviceActivityReport/AnalogAnchorDeviceActivityReport.entitlements

  AnalogAnchorKitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AnalogAnchorKit/Tests/AnalogAnchorKitTests
    dependencies:
      - package: AnalogAnchorKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.analoganchor.app.kittests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  AnalogAnchor:
    build:
      targets:
        AnalogAnchor: all
        AnalogAnchorKitTests: [test]
    test:
      targets:
        - AnalogAnchorKitTests
